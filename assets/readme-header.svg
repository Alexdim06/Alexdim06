<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Aleksandar Dimitrov - Full-Stack Developer</title>
  <desc id="description">Animated portfolio banner with soft fades, moving glow, and a live product window.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090c0a"/>
      <stop offset=".48" stop-color="#111713"/>
      <stop offset="1" stop-color="#0a0d0b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#c8ff47"/>
      <stop offset=".5" stop-color="#7ee787"/>
      <stop offset="1" stop-color="#ff785a"/>
      <animate attributeName="x1" values="-.4;1;-.4" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="x2" values=".6;2;.6" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#f3f1e9" stroke-opacity=".035"/>
    </pattern>
    <radialGradient id="glow">
      <stop stop-color="#c8ff47" stop-opacity=".2"/>
      <stop offset="1" stop-color="#c8ff47" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#c8ff47" stroke-opacity=".2"/>
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accent)"/>

  <circle cx="1000" cy="80" r="190" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="cx" values="980;1080;980" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="70;125;70" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".7;1;.7" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="330" r="130" fill="#ff785a" fill-opacity=".055" filter="url(#blur)">
    <animate attributeName="cx" values="110;220;110" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".7;1;.7" dur="10s" repeatCount="indefinite"/>
  </circle>

  <g fill="#c8ff47">
    <circle cx="240" cy="48" r="2"><animate attributeName="opacity" values="0;0.7;0" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="410" cy="310" r="2"><animate attributeName="opacity" values="0;0.55;0" dur="7s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="40" r="1.6"><animate attributeName="opacity" values="0;0.6;0" dur="8s" begin="2.2s" repeatCount="indefinite"/></circle>
  </g>

  <g transform="translate(74 65)">
    <rect width="62" height="62" rx="15" fill="#c8ff47">
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.2;1" dur="3s" fill="freeze"/>
    </rect>
    <text x="31" y="41" text-anchor="middle" fill="#0b0d0c" font-family="Arial, sans-serif" font-size="25" font-weight="800">AD</text>
    <circle cx="52" cy="52" r="4" fill="#ff785a">
      <animate attributeName="opacity" values="1;0.35;1" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="74" y="180" fill="#f3f1e9" font-size="54" font-weight="750" letter-spacing="-2">
      Aleksandar Dimitrov
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.18;1" dur="4.5s" fill="freeze"/>
    </text>

    <text x="76" y="222" fill="#a5a69f" font-size="21">
      Full-stack developer
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.08;0.26;0.34;1" dur="15s" repeatCount="indefinite"/>
    </text>
    <text x="76" y="222" fill="#a5a69f" font-size="21">
      Product builder
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.30;0.38;0.56;0.64;1" dur="15s" repeatCount="indefinite"/>
    </text>
    <text x="76" y="222" fill="#a5a69f" font-size="21">
      Frontend mentor
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.62;0.70;0.88;1" dur="15s" repeatCount="indefinite"/>
    </text>

    <text x="76" y="284" fill="#c8ff47" font-size="15" font-weight="700" letter-spacing="2">
      ANGULAR  /  STRAPI  /  DEVOPS  /  REAL-TIME PRODUCTS
      <animate attributeName="opacity" values="0.35;1;0.35" dur="8s" repeatCount="indefinite"/>
    </text>
  </g>

  <g transform="translate(850 120)" font-family="Arial, sans-serif">
    <rect width="272" height="154" rx="14" fill="#0d110f" stroke="#f3f1e9" stroke-opacity=".1"/>
    <circle cx="22" cy="21" r="4" fill="#ff785a"/>
    <circle cx="36" cy="21" r="4" fill="#f5c451"/>
    <circle cx="50" cy="21" r="4" fill="#c8ff47"/>
    <text x="218" y="25" fill="#c8ff47" font-size="10" font-weight="700">
      LIVE
      <animate attributeName="opacity" values="1;0.25;1" dur="2.8s" repeatCount="indefinite"/>
    </text>
    <path d="M24 104 C55 92 65 116 98 78 S148 98 172 58 S218 76 248 42" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" values="0 500;500 0" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".45;1;.45" dur="5.5s" repeatCount="indefinite"/>
    </path>
    <g fill="#c8ff47">
      <circle cx="98" cy="78" r="4"><animate attributeName="opacity" values=".3;1;.3" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="172" cy="58" r="4"><animate attributeName="opacity" values=".3;1;.3" dur="3.4s" begin="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="248" cy="42" r="4"><animate attributeName="opacity" values=".3;1;.3" dur="3.4s" begin="2.2s" repeatCount="indefinite"/></circle>
    </g>
    <text x="24" y="136" fill="#7d867f" font-size="10">
      products / systems / people
      <animate attributeName="opacity" values=".4;1;.4" dur="6s" repeatCount="indefinite"/>
    </text>
  </g>

  <g transform="translate(1020 315)" font-family="Arial, sans-serif">
    <circle cx="0" cy="0" r="5" fill="#c8ff47">
      <animate attributeName="opacity" values="1;.25;1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <text x="14" y="4" fill="#a5a69f" font-size="11">
      OPEN TO OPPORTUNITIES
      <animate attributeName="opacity" values=".45;1;.45" dur="5s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
