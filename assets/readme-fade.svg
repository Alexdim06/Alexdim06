<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="78" viewBox="0 0 1200 78" role="img" aria-label="Slowly fading introduction lines">
  <defs>
    <linearGradient id="fadeGlow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#c8ff47" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c8ff47" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff785a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="78" rx="16" fill="#0b0d0c"/>
  <rect x="1" y="1" width="1198" height="76" rx="15" fill="none" stroke="#c8ff47" stroke-opacity="0.12"/>
  <rect x="220" y="62" width="760" height="1" fill="url(#fadeGlow)">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="6s" repeatCount="indefinite"/>
  </rect>

  <g font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#c8ff47">
    <g>
      <text x="600" y="40">Building full-stack products</text>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.07;0.20;0.27;1" dur="18s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <text x="600" y="40">Angular + Strapi at production scale</text>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.23;0.30;0.45;0.52;1" dur="18s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <text x="600" y="40">NestSyncFlow  ·  UVE x SystemaWeb</text>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48;0.55;0.70;0.77;1" dur="18s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <text x="600" y="40">DevOps delivery  ·  Frontend mentoring</text>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.73;0.80;0.93;1" dur="18s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
